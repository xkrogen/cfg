# Portable personal Codex config. Machine-local runtime state (project trust, hook
# trust hashes, app-generated marketplace and plugin-cache paths) is intentionally
# absent; see cfg README "Codex configuration". Environment values are literal;
# only Codex path-typed fields support leading-tilde expansion.
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
approval_policy = "never"
sandbox_mode = "danger-full-access"

[tui]
status_line = ["thread-name", "model", "reasoning", "project-name", "run-state", "five-hour-limit", "weekly-limit", "context-window-size", "used-tokens", "permissions", "approval-mode"]
status_line_use_colors = true
screen_reader_detection_done = true

[features]
hooks = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

# App-bundled Node REPL. Only static values are set here: env values are literal
# strings. Per-machine trust paths and versioned service paths must come from the
# app's runtime configuration rather than this shared file.
[mcp_servers.node_repl]
args = []
command = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node_repl"
env_vars = ["BROWSER_USE_ACCESS_EXECUTOR_ID", "BROWSER_USE_ACCESS_PIPE_PATH", "BROWSER_USE_ACCESS_VERIFYING_IDENTITY"]
startup_timeout_sec = 120

[mcp_servers.node_repl.env]
NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS = "1000"
NODE_REPL_NODE_MODULE_DIRS = "/Applications/ChatGPT.app/Contents/Resources/cua_node/lib/node_modules"
NODE_REPL_NODE_PATH = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node"
BROWSER_USE_AVAILABLE_BACKENDS = "chrome,iab,mcpapps"
BROWSER_USE_TINYSKY_ENABLED = "1"
NODE_REPL_INSTRUCTIONS_USE_CASE_BROWSER = ""
NODE_REPL_INSTRUCTIONS_USE_CASE_CHROME = ""
NODE_REPL_INSTRUCTIONS_USE_CASE_COMPUTER_USE = ""
BROWSER_USE_CODEX_APP_BUILD_FLAVOR = "prod"

# Reviewed upstream integration, kept disabled. Enable only after review.
[mcp_servers.hindsight]
url = "https://api.hindsight.vectorize.io/mcp/xkrogen/"
enabled = false

[desktop]
followUpQueueMode = "queue"
show-context-window-usage = true
appshotAlwaysSendToMini = true
appshotSoundEnabled = false
open-link-in-target-preference = "external-browser"
open-local-url-in-target-preference = "external-browser"
realtimeVoiceScreenContextEnabled = true
conversationDetailMode = "STEPS_PROSE"
avatar-overlay-pet-visible = false
